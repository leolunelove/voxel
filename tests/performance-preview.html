<!doctype html><html><meta charset="utf-8"><title>Voxel / frame pacing study</title><style>body{margin:0;background:#17191d;color:#efd09d;font:14px monospace}canvas{display:block}aside{position:fixed;left:16px;top:16px;background:#18191fe8;padding:14px}button{background:#25282e;color:#efd09d;border:1px solid #c59658;padding:9px;cursor:pointer}pre{line-height:1.5}</style><aside><button id="yard">Courtyard</button> <button id="mine">Mine</button> <button id="combat">Iron Hall</button> <button id="adaptive">Adaptive resolution</button> <button id="run">Measure 180 frames</button><pre id="result">Ready</pre></aside><script type="module">
import {LightBudget,RenderQuality} from '../src/engine/render-quality.js?v=73.2';import * as T from '../vendor/three.module.js';import {CampWorld} from '../src/game/camp.js?v=73.2';import {freshState} from '../src/game/rules.js';import {Daylight} from '../src/engine/daylight.js?v=73.2';import {Hunt} from '../src/game/hunt.js?v=73.2';import {freshHunt} from '../src/game/hunt-rules.js';
const scene=new T.Scene(),world=new CampWorld(scene);world.configure({...freshState(),mined:20,mineLevel:2,forestLevel:2},true);new Hunt(scene,freshHunt());const daylight=new Daylight(world,scene),camera=new T.PerspectiveCamera(72,innerWidth/innerHeight,.05,180),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);

function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05),ms=now-last;last=now;daylight.update(18,dt);world.update(0,true,camera.position);budget.update(dt,camera);if(adaptive){const ratio=quality.sample(dt);if(ratio!==null)renderer.setPixelRatio(ratio);}const start=performance.now();renderer.render(scene,camera);const renderMs=performance.now()-start;if(run){if(warm>0)warm--;else{samples.push(ms);cpu.push(renderMs);calls.push(renderer.info.render.calls);out.textContent='Measuring '+samples.length+' / 180';if(samples.length===180){run=false;const sorted=[...samples].sort((a,b)=>a-b),avg=a=>a.reduce((s,v)=>s+v,0)/a.length;out.textContent=JSON.stringify({view,pixelRatio:renderer.getPixelRatio(),frames:180,meanFrameMs:+avg(samples).toFixed(2),p95FrameMs:+sorted[170].toFixed(2),renderSubmitMs:+avg(cpu).toFixed(2),drawCalls:+avg(calls).toFixed(1),triangles:renderer.info.render.triangles,meshObjects:(()=>{let n=0;scene.traverse(o=>{if(o.isMesh)n++;});return n;})()},null,2);}}}}room('mine');requestAnimationFrame(frame);
