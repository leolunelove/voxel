<!doctype html><html><meta charset="utf-8"><title>Voxel / arrow contact study</title><style>body{margin:0;background:#17191d;color:#efd09d;font:15px monospace}canvas{display:block}aside{position:fixed;left:16px;top:16px;background:#18191fee;padding:16px}button{background:#25282e;color:#efd09d;border:1px solid #c59658;padding:10px;cursor:pointer}pre{line-height:1.5}</style><aside><button id="weak">Half draw</button> <button id="full">Full draw</button> <button id="resume">Play reaction</button> <button id="reset">Reset</button><pre id="status">Ready / Yard crawler · 52 HP</pre></aside><script type="module">
import * as T from '../vendor/three.module.js';import {Hunt} from '../src/game/hunt.js?v=73.2';import {Archery} from '../src/game/archery.js?v=73.2';import {freshHunt,MONSTERS} from '../src/game/hunt-rules.js?v=73.2';import {Feedback} from '../src/engine/feedback.js?v=73.2';import {Audio} from '../src/engine/audio.js?v=73.2';
const scene=new T.Scene();scene.background=new T.Color(0x34373d);scene.add(new T.HemisphereLight(0xdfebff,0x403728,2.2));const light=new T.DirectionalLight(0xffce96,3);light.position.set(3,6,4);scene.add(light);const floor=new T.Mesh(new T.BoxGeometry(20,1,20),new T.MeshStandardMaterial({color:0x777267}));floor.position.y=.5;scene.add(floor);
const state=freshHunt(),hunt=new Hunt(scene,state,{spawns:[[0,0,0,0]],bounds:[-4,4,-4,4],active:()=>true,statsFor:t=>({...MONSTERS[t],speed:0}),respawn:false}),e=hunt.enemies[0],camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,100);camera.position.set(3,2.8,5.6);camera.lookAt(0,2.05,0);const view=new T.PerspectiveCamera();view.position.set(0,2.15,4);view.lookAt(0,2.15,0);view.updateMatrixWorld();const feedback=new Feedback(scene,camera),audio=new Audio(),archery=new Archery(scene,state,()=>{});archery.root.visible=false;archery.targets=[];archery.combatTargets=hunt.targets;
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);let running=false,freeze=-1,last=0;const status=document.getElementById('status');
archery.onEnemyHit=(enemy,source,damage,point,impact)=>{hunt.strike(enemy,source,damage,'archery',impact);feedback.arrowImpact(point,impact.velocity,impact.charge,false);audio.play('monster-arrow-hit',impact.charge);freeze=.07;status.textContent=(impact.charge===1?'FULL POWER':'HALF DRAW')+' / '+damage+' damage\nHP '+enemy.hp+' / 52 · '+enemy.embeddedArrows.length+' arrows embedded\nContact paused at 70ms · Play reaction to continue';};
function shot(charge){audio.unlock();scene.updateMatrixWorld(true);view.lookAt(e.root.position.x,e.root.position.y+1.15,e.root.position.z);view.updateMatrixWorld();archery.fire(view,charge);running=true;freeze=-1;}
document.getElementById('weak').onclick=()=>shot(.5);document.getElementById('full').onclick=()=>shot(1);document.getElementById('resume').onclick=()=>{freeze=-1;running=true;};document.getElementById('reset').onclick=()=>{hunt.reset();archery.reset();running=false;status.textContent='Ready / Yard crawler · 52 HP';};
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.025,(now-last)/1000);last=now;if(running){archery.update(dt,false,view,true,{obstructed:()=>false});hunt.update(dt,view.position);feedback.update(dt,false,0,false);if(freeze>=0){freeze-=dt;if(freeze<=0)running=false;}}renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></html>
