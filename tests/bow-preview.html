<!doctype html><html lang="en"><meta charset="utf-8"><title>Voxel / bow draw study</title><style>body{background:#23272d;color:#ebd4aa;margin:20px;font:15px monospace}main{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}canvas{width:100%;display:block}h2{font-size:15px}button{padding:12px;background:#34383d;color:#ffd188;border:1px solid #c59b5b;margin-bottom:15px}section{position:relative}.reticle{position:absolute;top:54%;left:50%}</style><h1>Voxel / draw → tension → release</h1><button id="loop">Animate draw and release</button><button id="poses">Freeze poses</button><main></main><script type="module">
import * as T from '../vendor/three.module.js';import {Feedback} from '../src/engine/feedback.js?v=72';import {bowPose,BOW_SCALE} from '../src/engine/pickaxe.js?v=72';import {bowRig,applyBowRig} from '../src/engine/bow-motion.js?v=72';
const views=[];let animate=false,start=performance.now();
for(const [label,d,age]of [['Rest / no arrow',0,Infinity],['Half draw',.5,Infinity],['Full tension',1,Infinity],['Release / 16ms',0,.016],['String recoil / 45ms',0,.045],['Recovered / 240ms',0,.24]]){const section=document.createElement('section');section.innerHTML='<h2>'+label+'</h2><canvas></canvas><span class="reticle">+</span>';document.querySelector('main').append(section);const f=new Feedback(new T.Scene());f.resize(16/9);f.setTier(0,'bow');const renderer=new T.WebGLRenderer({canvas:section.querySelector('canvas'),antialias:true});renderer.setSize(640,360,false);renderer.setClearColor(0x52616a);renderer.toneMapping=T.ACESFilmicToneMapping;views.push({f,renderer,d,age});}
function render(now){requestAnimationFrame(render);const t=(now-start)/1000%2.7;for(const {f,renderer,d,age}of views){const rig=bowRig(animate?(t<1?t:t<1.6?1:0):d,animate?(t<1.6?Infinity:t-1.6):age);applyBowRig(f.tool,rig);const pose=bowPose(rig.stance,16/9);f.pivot.position.fromArray(pose.position);f.pivot.position.z+=rig.follow;f.pivot.rotation.fromArray(pose.rotation);f.tool.scale.setScalar(BOW_SCALE);renderer.render(f.view,f.camera);}}
document.getElementById('loop').onclick=()=>{animate=true;start=performance.now();};document.getElementById('poses').onclick=()=>animate=false;render(performance.now());
</script></html>
