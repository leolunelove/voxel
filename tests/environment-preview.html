<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Voxel environment inspector — no save</title><style>body{margin:0;background:#14231d;color:#eee;font:12px monospace}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:12px;left:12px;display:flex;gap:7px;align-items:center;padding:10px;background:#14251eea;border:1px solid #b0c18b44}button{background:#36523f;color:#eee;border:1px solid #b1c68d55;padding:9px 12px;cursor:pointer}button:focus-visible{outline:2px solid #e8bb79}span{color:#c3b282;margin:0 8px}</style></head><body><canvas></canvas><nav aria-label="Environment inspector"><span>QA / NO SAVE</span><button data-mine="0">A Deepwell</button><button data-mine="1">B Ironworks</button><button data-mine="2">C Gilded Fault</button><button data-mine="3">D Ember Hollow</button><button id="angle">Gate / gallery</button><span id="status"></span></nav><script type="module">
import * as T from '../vendor/three.module.js?v=15';
import {World} from '../src/game/world.js?v=15';
import {Player} from '../src/game/player.js?v=15';
import {LAYOUTS} from '../src/game/layouts.js?v=15';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
const scene=new T.Scene();scene.fog=new T.FogExp2();const world=new World(scene),camera=new T.PerspectiveCamera(72,1,.05,100);let mine=0,gallery=false;
function position(){const L=LAYOUTS[mine];camera.position.fromArray(L.spawn);if(gallery)camera.position.set(8,5.6,5);camera.lookAt(gallery?0:L.spawn[0],2.6,-12);const probe=new Player(new T.PerspectiveCamera(),{keys:new Set(),pitch:0,yaw:0},world);probe.home();document.getElementById('status').textContent=L.id+' / '+world.meshes.length+' blocks / '+(probe.fits(probe.position)?'SPAWN CLEAR':'SPAWN BLOCKED');}
document.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{mine=Number(b.dataset.mine);world.generate(mine);position();});document.getElementById('angle').onclick=()=>{gallery=!gallery;position();};function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}window.addEventListener('resize',resize);resize();position();let previous=performance.now();function frame(now){const dt=Math.min((now-previous)/1000,.05);previous=now;world.update(dt);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
