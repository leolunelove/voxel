<!doctype html><html lang="en"><meta charset="utf-8"><title>Voxel / Iron & Ember material study</title><style>body{margin:0;background:#18191e;color:#e8c391;font:14px monospace}canvas{display:block}aside{position:fixed;left:16px;top:16px;max-width:850px;background:#18191fe8;padding:12px}button{background:#25282e;color:#efd09d;border:1px solid #bc945c;padding:9px;cursor:pointer}pre{line-height:1.4;margin:10px 0 0}</style><aside><button id="yard">Cellblock & courtyard</button> <button id="cell">Cell 07</button> <button id="mine">Mine entrance</button> <button id="props">Exchange props</button> <button id="day">Day</button> <button id="night">Night</button> <button id="detail">Detail: ON</button> <button id="measure">Measure 180 frames</button><pre id="status">Ready</pre></aside><script type="module">
import * as T from '../vendor/three.module.js';import {CampWorld} from '../src/game/camp.js?v=74.2';import {freshState} from '../src/game/rules.js?v=74.2';import {Daylight} from '../src/engine/daylight.js?v=74.2';import {LightBudget} from '../src/engine/render-quality.js?v=74.2';
const scene=new T.Scene(),world=new CampWorld(scene);world.configure({...freshState(),mined:20,mineLevel:2,forestLevel:2},true);const daylight=new Daylight(world,scene),budget=new LightBudget(scene),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,180),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
let hour=12,view='yard',measure=false,warm=0,last=0,frames=[],cpu=[],calls=[];const status=document.getElementById('status'),poses={yard:[[-4,2.9,4],[9,3.6,15]],cell:[[12.5,2.65,15.1],[14.1,2.7,18.1]],mine:[[-7.5,2.65,2],[-10,3.4,-5.5]],props:[[15.3,2.7,7.2],[10,2.4,10]]};
function room(id){view=id;camera.position.fromArray(poses[id][0]);camera.lookAt(...poses[id][1]);status.textContent='Ready / '+id;}
for(const id of Object.keys(poses))document.getElementById(id).onclick=()=>room(id);document.getElementById('day').onclick=()=>hour=12;document.getElementById('night').onclick=()=>hour=22;document.getElementById('detail').onclick=e=>{world.architecture.detail.value=1-world.architecture.detail.value;e.currentTarget.textContent='Detail: '+(world.architecture.detail.value?'ON':'OFF');};document.getElementById('measure').onclick=()=>{measure=true;warm=60;frames=[];cpu=[];calls=[];status.textContent='Warming up…';};
function frame(now){requestAnimationFrame(frame);const ms=now-last,dt=Math.min(ms/1000,.05);last=now;daylight.update(hour,dt);world.update(0,true,camera.position);budget.update(dt,camera);const start=performance.now();renderer.render(scene,camera);const submit=performance.now()-start;if(measure){if(warm>0)warm--;else{frames.push(ms);cpu.push(submit);calls.push(renderer.info.render.calls);status.textContent='Measuring '+frames.length+' / 180';if(frames.length===180){measure=false;const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;status.textContent=JSON.stringify({view,hour,detail:world.architecture.detail.value,pixelRatio:renderer.getPixelRatio(),meanFrameMs:+avg(frames).toFixed(2),p95FrameMs:+[...frames].sort((a,b)=>a-b)[170].toFixed(2),renderSubmitMs:+avg(cpu).toFixed(2),drawCalls:+avg(calls).toFixed(1),triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,atlasBytes:world.architecture.atlas.image.data.byteLength},null,2);}}}}room('yard');requestAnimationFrame(frame);
</script></html>
