<!doctype html><html lang="en"><meta charset="utf-8"><title>Voxel / Training wings study</title><style>body{margin:0;background:#18191e;color:#e8c391;font:14px monospace}canvas{display:block}aside{position:fixed;left:16px;top:16px;background:#18191fe8;padding:12px}button{background:#25282e;color:#efd09d;border:1px solid #bc945c;padding:9px;cursor:pointer}pre{line-height:1.4}</style><aside><button id="yard">Work block</button> <button id="gate">Iron Hall gate</button> <button id="corridor">Containment passage</button> <button id="turn">Iron Hall reveal</button> <button id="reveal">Long Room reveal</button> <button id="overview">Overview</button><br><button id="lock">Lock gates</button> <button id="unlock">Open gates</button> <button id="expand">Expand allotment</button> <button id="day">Day</button> <button id="night">Night</button> <button id="measure">Measure 180 frames</button><pre id="status">Ready</pre></aside><script type="module">
import * as T from '../vendor/three.module.js';import {CampWorld} from '../src/game/camp.js?v=76.1';import {freshState} from '../src/game/rules.js?v=76.1';import {Daylight} from '../src/engine/daylight.js?v=76.1';import {LightBudget} from '../src/engine/render-quality.js?v=76.1';
import {Archery} from '../src/game/archery.js?v=76.1';import {Hunt} from '../src/game/hunt.js?v=76.1';import {freshHunt} from '../src/game/hunt-rules.js?v=76.1';import {trainingLevel} from '../src/game/training-layout.js?v=76.1';
const scene=new T.Scene(),world=new CampWorld(scene),s={...freshState(),mined:120};world.configure(s,true);const hunt=freshHunt(),monsters=new Hunt(scene,hunt),archery=new Archery(scene,hunt,()=>{});const daylight=new Daylight(world,scene),budget=new LightBudget(scene),camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,200),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
let hour=12,view='yard',running=false,warm=0,last=0,frames=[],cpu=[],calls=[];const status=document.getElementById('status'),poses={yard:[[.5,2.65,8],[-4,3.6,-6]],gate:[[0,2.65,11],[0,4.5,16]],corridor:[[0,2.65,19],[5,2.8,22]],turn:[[6,2.65,32.7],[6,3.5,42]],reveal:[[34,2.65,26],[47,3,27]],overview:[[70,48,75],[12,1,9]]};
function room(id){view=id;camera.position.fromArray(poses[id][0]);camera.lookAt(...poses[id][1]);status.textContent='Ready / '+id+' / Level '+trainingLevel(s)+' / Plot '+s.forestLevel;}
for(const id of Object.keys(poses))document.getElementById(id).onclick=()=>room(id);document.getElementById('lock').onclick=()=>{s.mined=59;s.forestLevel=0;world.configure(s,true);room('gate');};document.getElementById('unlock').onclick=()=>{s.mined=120;world.configure(s);};document.getElementById('expand').onclick=()=>{s.mined=120;s.forestLevel=(s.forestLevel+1)%3;world.configure(s);room('reveal');};document.getElementById('day').onclick=()=>hour=12;document.getElementById('night').onclick=()=>hour=22;document.getElementById('measure').onclick=()=>{running=true;warm=60;frames=[];cpu=[];calls=[];};
function frame(now){requestAnimationFrame(frame);const ms=now-last,dt=Math.min(ms/1000,.05);last=now;daylight.update(hour,dt);world.update(dt,false,camera.position);budget.update(dt,camera);const start=performance.now();renderer.render(scene,camera);const submit=performance.now()-start;if(running){if(warm>0)warm--;else{frames.push(ms);cpu.push(submit);calls.push(renderer.info.render.calls);status.textContent='Measuring '+frames.length+' / 180';if(frames.length===180){running=false;const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;status.textContent=JSON.stringify({view,hour,stage:s.forestLevel,pixelRatio:renderer.getPixelRatio(),meanFrameMs:+avg(frames).toFixed(2),p95FrameMs:+[...frames].sort((a,b)=>a-b)[170].toFixed(2),renderSubmitMs:+avg(cpu).toFixed(2),drawCalls:+avg(calls).toFixed(1),triangles:renderer.info.render.triangles},null,2);}}}}room('yard');requestAnimationFrame(frame);
</script></html>
