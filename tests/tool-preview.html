<!doctype html><meta charset="utf-8"><title>Voxel / pickaxe motion study</title>
<style>body{margin:20px;background:#18251e;color:#e8dcc0;font:14px monospace}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}canvas{width:100%;display:block}h2{font-size:14px}</style>
<h1>Pickaxe / contact study</h1><p>Read-only poses from the live tool model. Lift → strike → stop → recoil → rest.</p><main></main>
<script type="module">
import * as T from '../vendor/three.module.js?v=30';
import {Feedback} from '../src/engine/feedback.js?v=30';
import {heldPose,TOOL_SCALE} from '../src/engine/pickaxe.js?v=30';
for(const [label,phase] of [['Rest',0],['Lift',.16],['Downstroke',.25],['Contact',.30],['Recoil',.48],['Recovery',.8]]){
 const article=document.createElement('article');article.innerHTML='<h2>'+label+'</h2><canvas></canvas>';document.querySelector('main').append(article);
 const f=new Feedback(new T.Scene());f.resize(1.3);f.setTier(2);const p=heldPose(phase,1.3);f.pivot.position.fromArray(p.position);f.pivot.rotation.fromArray(p.rotation);f.tool.scale.setScalar(TOOL_SCALE);
 const renderer=new T.WebGLRenderer({canvas:article.querySelector('canvas'),antialias:false});renderer.setSize(390,300,false);renderer.setClearColor(0x536052);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.render(f.view,f.camera);
 const marker=document.createElement('div');marker.textContent='+';marker.style='position:absolute;left:50%;top:50%;color:white';const wrap=document.createElement('div');wrap.style='position:relative';article.append(wrap);wrap.append(article.querySelector('canvas'),marker);
}
</script>
