<!doctype html><html lang="en"><meta charset="utf-8"><title>Voxel / Conservatory wing study</title><style>body{margin:0;background:#18191e;color:#e8c391;font:14px monospace}canvas{display:block}aside{position:fixed;left:16px;top:16px;background:#18191fe8;padding:12px}button{background:#25282e;color:#efd09d;border:1px solid #bc945c;padding:9px;cursor:pointer}pre{line-height:1.4}</style><aside><button id="yard">Work block</button> <button id="gate">Checkpoint</button> <button id="corridor">Corridor</button> <button id="turn">Final turn</button> <button id="reveal">Nursery reveal</button> <button id="overview">Overview</button><br><button id="lock">Level 1 / locked</button> <button id="unlock">Level 2 / open</button> <button id="expand">Expand allotment</button> <button id="day">Day</button> <button id="night">Night</button> <button id="measure">Measure 180 frames</button><pre id="status">Ready</pre></aside><script type="module">
import * as T from '../vendor/three.module.js';import {CampWorld} from '../src/game/camp.js?v=75.3';import {freshState} from '../src/game/rules.js?v=75.3';import {Daylight} from '../src/engine/daylight.js?v=75.3';import {LightBudget} from '../src/engine/render-quality.js?v=75.3';
const scene=new T.Scene(),world=new CampWorld(scene),s={...freshState(),mined:20};world.configure(s,true);const daylight=new Daylight(world,scene),budget=new LightBudget(scene),camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,200),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
let hour=12,view='yard',running=false,warm=0,last=0,frames=[],cpu=[],calls=[];const status=document.getElementById('status'),poses={yard:[[.5,2.65,8],[-4,3.6,-6]],gate:[[8,2.65,-2],[8,3.7,-6]],corridor:[[10.5,2.65,-10],[28,2.65,-10]],turn:[[27,2.65,-10],[28,3,-16]],reveal:[[28,2.65,-13],[29,4,-24]],overview:[[58,34,26],[9,1,-10]]};
function room(id){view=id;camera.position.fromArray(poses[id][0]);camera.lookAt(...poses[id][1]);status.textContent='Ready / '+id+' / Level '+(s.mined>=20?2:1)+' / Plot '+s.forestLevel;}
for(const id of Object.keys(poses))document.getElementById(id).onclick=()=>room(id);document.getElementById('lock').onclick=()=>{s.mined=19;s.forestLevel=0;world.configure(s,true);room('gate');};document.getElementById('unlock').onclick=()=>{s.mined=20;world.configure(s);};document.getElementById('expand').onclick=()=>{s.mined=20;s.forestLevel=(s.forestLevel+1)%3;world.configure(s);room('reveal');};document.getElementById('day').onclick=()=>hour=12;document.getElementById('night').onclick=()=>hour=22;document.getElementById('measure').onclick=()=>{running=true;warm=60;frames=[];cpu=[];calls=[];};
function frame(now){requestAnimationFrame(frame);const ms=now-last,dt=Math.min(ms/1000,.05);last=now;daylight.update(hour,dt);world.update(dt,false,camera.position);budget.update(dt,camera);const start=performance.now();renderer.render(scene,camera);const submit=performance.now()-start;if(running){if(warm>0)warm--;else{frames.push(ms);cpu.push(submit);calls.push(renderer.info.render.calls);status.textContent='Measuring '+frames.length+' / 180';if(frames.length===180){running=false;const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;status.textContent=JSON.stringify({view,hour,stage:s.forestLevel,pixelRatio:renderer.getPixelRatio(),meanFrameMs:+avg(frames).toFixed(2),p95FrameMs:+[...frames].sort((a,b)=>a-b)[170].toFixed(2),renderSubmitMs:+avg(cpu).toFixed(2),drawCalls:+avg(calls).toFixed(1),triangles:renderer.info.render.triangles},null,2);}}}}room('yard');requestAnimationFrame(frame);
</script></html>
